services:
  app:
    image: valsea-app:current
    restart: unless-stopped
    env_file: server.env
    ports:
      - "8001:3000"
    volumes:
      - /var/lib/valsea:/data
    mem_limit: 700m
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3000');if(!r.ok)process.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
