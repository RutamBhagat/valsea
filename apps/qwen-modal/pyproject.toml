[project]
name = "qwen-modal"
version = "0.1.0"
description = "Modal-hosted Qwen3 ASR service and benchmark client"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "modal>=1.5.4,<2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.poe.tasks]
_lint = "uvx ruff@0.16.4 check src scripts"
_compile = "python -m compileall -q src scripts"
_typecheck = "basedpyright"
check = ["_lint", "_compile", "_typecheck"]
modal-dev = "modal serve -m qwen_modal.app"
modal-deploy = "modal deploy -m qwen_modal.app"
benchmark = "python scripts/benchmark.py"

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.basedpyright]
include = ["src", "scripts"]
typeCheckingMode = "strict"
allowedUntypedLibraries = ["modal"]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "basedpyright>=1.31.4,<2",
    "poethepoet>=0.48.0",
]
