[project]
name = "qwen-modal"
version = "0.1.0"
description = "Modal-hosted Qwen3 ASR service and benchmark client"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.4,<2",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.poe.tasks]
_compile = "python -m compileall -q src scripts"
_typecheck = "uvx --from basedpyright==1.39.10 basedpyright"
check = ["_compile", "_typecheck"]
modal-dev = "modal serve -m qwen_modal.app"
modal-deploy = "modal deploy -m qwen_modal.app"
benchmark = "python scripts/benchmark.py"

[tool.basedpyright]
include = ["src", "scripts"]
stubPath = "typings"
typeCheckingMode = "recommended"
allowedUntypedLibraries = ["modal"]
reportMissingModuleSource = false
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
]
