name: Deploy web to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/server/src/**"
      - "packages/config/**"
      - "packages/env/**"
      - "packages/infra/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check-types
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SERVER_URL: https://valsea.rutam.dpdns.org
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Deploy production web app
        working-directory: packages/infra
        run: bun run deploy -- --stage production
      - name: Smoke test
        run: curl --fail --retry 6 --retry-delay 5 --retry-all-errors https://app-valsea.rutam.dpdns.org/
