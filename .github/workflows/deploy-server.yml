name: Deploy server to OCI with Kamal

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/qwen-modal/benchmark_result.json"
      - "packages/auth/**"
      - "packages/benchmark/**"
      - "packages/config/**"
      - "packages/db/**"
      - "packages/env/**"
      - "config/deploy.yml"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/rutambhagat/valsea
  KAMAL_VERSION: 2.12.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check-types
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Verify Docker image builds
        run: docker build --file apps/server/Dockerfile --tag valsea:ci .
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check Qwen Modal project
        working-directory: apps/qwen-modal
        run: |
          uv sync --frozen
          uv run poe check

  deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        run: |
          docker build \
            --file apps/server/Dockerfile \
            --label "service=valsea" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --platform linux/arm64 \
            --tag "$IMAGE:${{ github.sha }}" \
            .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: a1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install pinned Kamal
        run: gem install kamal --version "$KAMAL_VERSION" --no-document

      - name: Configure SSH
        env:
          A1_SSH_KNOWN_HOSTS: ${{ secrets.A1_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$A1_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host a1
            User ubuntu
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Configure Kamal secrets
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VALSEA_API_KEY: ${{ secrets.VALSEA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_MODAL_URL: ${{ secrets.QWEN_MODAL_URL }}
          MODAL_PROXY_TOKEN_ID: ${{ secrets.MODAL_PROXY_TOKEN_ID }}
          MODAL_PROXY_TOKEN_SECRET: ${{ secrets.MODAL_PROXY_TOKEN_SECRET }}
          CLOUDFLARE_ORIGIN_CERTIFICATE: ${{ secrets.CLOUDFLARE_ORIGIN_CERTIFICATE }}
          CLOUDFLARE_ORIGIN_PRIVATE_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_PRIVATE_KEY }}
        run: |
          install -m 700 -d .kamal
          cat > .kamal/secrets <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_URL=$BETTER_AUTH_URL
          CORS_ORIGIN=$CORS_ORIGIN
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          VALSEA_API_KEY=$VALSEA_API_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          QWEN_MODAL_URL=$QWEN_MODAL_URL
          MODAL_PROXY_TOKEN_ID=$MODAL_PROXY_TOKEN_ID
          MODAL_PROXY_TOKEN_SECRET=$MODAL_PROXY_TOKEN_SECRET
          CLOUDFLARE_ORIGIN_CERTIFICATE=$CLOUDFLARE_ORIGIN_CERTIFICATE
          CLOUDFLARE_ORIGIN_PRIVATE_KEY=$CLOUDFLARE_ORIGIN_PRIVATE_KEY
          EOF
          chmod 600 .kamal/secrets

      - name: Deploy existing image with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VALSEA_API_KEY: ${{ secrets.VALSEA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_MODAL_URL: ${{ secrets.QWEN_MODAL_URL }}
          MODAL_PROXY_TOKEN_ID: ${{ secrets.MODAL_PROXY_TOKEN_ID }}
          MODAL_PROXY_TOKEN_SECRET: ${{ secrets.MODAL_PROXY_TOKEN_SECRET }}
          CLOUDFLARE_ORIGIN_CERTIFICATE: ${{ secrets.CLOUDFLARE_ORIGIN_CERTIFICATE }}
          CLOUDFLARE_ORIGIN_PRIVATE_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_PRIVATE_KEY }}
        run: kamal deploy --skip-push --version "${GITHUB_SHA}"
