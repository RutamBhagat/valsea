name: Deploy server to OCI with Uncloud

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/auth/**"
      - "apps/qwen-modal/**"
      - "packages/config/**"
      - "packages/db/**"
      - "packages/env/**"
      - "compose.yaml"
      - ".dockerignore"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/rutambhagat/valsea
  UNCLOUD_VERSION: "0.20.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run check-types
      - name: Verify Docker image builds
        run: docker build --file apps/server/Dockerfile --tag valsea:ci .
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          working-directory: apps/qwen-modal
      - name: Check Qwen Modal project
        working-directory: apps/qwen-modal
        run: |
          uv sync --frozen
          uv run poe check

  deploy:
    needs: verify
    runs-on: ubuntu-24.04-arm
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        run: |
          docker build \
            --file apps/server/Dockerfile \
            --label "service=valsea" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --platform linux/arm64 \
            --tag "$IMAGE:${{ github.sha }}" \
            .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: a1

      - name: Install pinned Uncloud CLI
        run: |
          archive="uc_linux_arm64.tar.gz"
          base="https://github.com/psviderski/uncloud/releases/download/v${UNCLOUD_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive"
          sudo install -m 755 uc /usr/local/bin/uc
          uc version

      - name: Configure SSH
        env:
          A1_SSH_KNOWN_HOSTS: ${{ secrets.A1_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$A1_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host a1
            User ubuntu
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy with Uncloud
        env:
          IMAGE_TAG: ${{ github.sha }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VALSEA_API_KEY: ${{ secrets.VALSEA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uc deploy --connect a1 --yes

      - name: Keep at most one previous application image
        run: |
          ssh a1 "repo='$IMAGE'; ids=\$(DOCKER_API_VERSION=1.44 docker image ls \"\$repo\" --format '{{.ID}}' | awk '!seen[\$0]++' | tail -n +3); [ -z \"\$ids\" ] || DOCKER_API_VERSION=1.44 docker image rm --force \$ids"
