service: valsea

image: rutambhagat/valsea

ssh:
  user: ubuntu

registry:
  server: ghcr.io
  username: RutamBhagat
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64

proxy:
  host: valsea.rutam.dpdns.org
  app_port: 8001
  forward_headers: true
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERTIFICATE
    private_key_pem: CLOUDFLARE_ORIGIN_PRIVATE_KEY
  healthcheck:
    path: /healthz
    interval: 2
    timeout: 3

volumes:
  - /var/lib/valsea:/data

servers:
  web:
    hosts:
      - a1
    options:
      memory: 700m

retain_containers: 1
deploy_timeout: 30
drain_timeout: 15

minimum_version: 2.12.0

env:
  clear:
    NODE_ENV: production
  secret:
    - BETTER_AUTH_SECRET
    - BETTER_AUTH_URL
    - CORS_ORIGIN
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - VALSEA_API_KEY
    - GEMINI_API_KEY
    - QWEN_MODAL_URL
    - MODAL_PROXY_TOKEN_ID
    - MODAL_PROXY_TOKEN_SECRET
